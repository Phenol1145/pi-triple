services:
  pi-platform:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - workspaces:/data/workspaces
      - platform:/data/platform
      - tenants:/data/tenants
      - components:/data/components
      - agent-dir:/data/agent-dir
      - sessions:/data/sessions
      - agent-lab:/data/agent-lab
    environment:
      - REDIS_URL=redis://redis:6379
      - PI_ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - PI_OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - LOG_LEVEL=info
      - PI_CODING_AGENT_DIR=/data/agent-dir
      - AGENT_LAB_DB_PATH=/data/agent-lab/agent-lab.db
      - DATA_DIR=/data
  # F/WP3 Task 11：sandbox 转发客户端 env（共享密钥 compose 注入，非镜像硬编码）
      - SANDBOX_URL=http://sandbox:8080
      - SANDBOX_SHARED_SECRET=${SANDBOX_SHARED_SECRET:-sandbox-dev-secret}
    # F/WP3 Task 13：sandbox 失效降级阈值（连续 N 次转发失败置 degraded；默认 3，可 env 覆盖）
      - SANDBOX_DEGRADED_THRESHOLD=${SANDBOX_DEGRADED_THRESHOLD:-3}
    # 路径约定统一（F/WP3 Task 12）：pth 侧 WorkspaceManager basePath = <DATA_DIR>/workspaces
    # = /data/workspaces（DATA_DIR=/data），与 sandbox 侧 cwd 白名单根 workspacesRoot 一致；
    # 双容器同挂 workspaces 卷同路径 → 转发 cwd 无需任何路径映射（smooth 直通）。
    # programs→components v1 direct switch + startup alert:
    # compose detects old programs dir on startup and logs WARN
    # prompting manual migration (code-side migration is Task 17).
    # Persistence invariant verification checklist (compose down && up):
    #   - 构件在 /data/components 持久化
    #   - agent 能力在 /data/agent-dir 持久化
    #   - 会话在 /data/sessions 持久化（WP2 后可恢复）
    #   - 认证不失效（Redis appendonly + 凭据外置）
    # Redis capacity monitoring runbook:
    #   - used_memory > 80% maxmemory → human intervention required
    #   - Metrics exposed at /metrics as pi_redis_used_memory_bytes / pi_redis_max_memory_bytes
    depends_on:
      redis:
        condition: service_healthy
      # F/WP3 Task 11：pth 的 bash 工具依赖 sandbox 就绪（转发 /exec）
      sandbox:
        condition: service_healthy
    # pth 需访问 sandbox（bash 转发）→ 双网络：default（出网调 LLM）+ sandbox-internal（内网锁）
    networks:
      - default
      - sandbox-internal
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G

  # F/WP3 Task 10：唯一代码执行 sandbox。egress 锁定 = 仅 internal 网络（无任何外部出口）；
  # 共享密钥 env 注入；资源限额 CPU/内存；非 root（Dockerfile USER node）。
  # 执行 API：POST /exec / GET /exec/:id/stream（SSE）/ GET /health。
  # 路径约定统一（F/WP3 Task 12）：workspaces 共享卷 = pth:/data/workspaces = sandbox:/data/workspaces
  # （同卷同路径——转发 cwd 无需映射）；sandbox 侧 cwd 白名单根（exec-api workspacesRoot）默认
  # /data/workspaces，与 pth 侧 WorkspaceManager basePath（DATA_DIR=/data 时）完全一致。
  sandbox:
    build:
      context: .
      dockerfile: Dockerfile.sandbox
    volumes:
      - workspaces:/data/workspaces
    environment:
      - SANDBOX_SHARED_SECRET=${SANDBOX_SHARED_SECRET:-sandbox-dev-secret}
      - LOG_LEVEL=info
    networks:
      - sandbox-internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 1gb --maxmemory-policy noeviction
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  workspaces:
  platform:
  tenants:
  components:
  agent-dir:
  sessions:
  agent-lab:
  redis-data:

# sandbox-internal：internal:true 网络——sandbox 只能被同网容器（pth）访问，自身无外部出口
# （egress 锁定）；redis/其他服务不在该网（sandbox 无需访问 Redis）。
networks:
  default:
  sandbox-internal:
    internal: true
