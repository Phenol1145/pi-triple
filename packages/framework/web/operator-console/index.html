<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PTL Operator Console</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <span class="brand">PTL Operator Console</span>
    <span id="session-state" class="session-state">未连接</span>
  </header>

  <div class="layout">
    <nav class="sidebar" aria-label="Operator Console 页面">
      <button class="nav-item" type="button" data-page="overview">Overview</button>
      <button class="nav-item" type="button" data-page="work">Work</button>
      <button class="nav-item" type="button" data-page="debug">Debug</button>
      <button class="nav-item" type="button" data-page="memory">Memory</button>
      <button class="nav-item" type="button" data-page="config">Config</button>
    </nav>

    <main class="content">
      <section class="page" id="page-overview" data-page-root="overview">
        <h1>Overview</h1>
        <p class="placeholder">Overview 页面将在后续任务实现。</p>
      </section>
      <section class="page" id="page-work" data-page-root="work" hidden>
        <h1>Work</h1>
        <p class="placeholder">Work 页面将在后续任务实现。</p>
      </section>
      <section class="page" id="page-debug" data-page-root="debug" hidden>
        <h1>Debug</h1>
        <p class="page-note">只读：Worker 检查投影，2 秒轮询；无任何控制动作。</p>
        <div class="debug-toolbar">
          <label>Worker ID <input id="debug-filter-worker" type="text" placeholder="包含匹配"></label>
          <label>Role ID <input id="debug-filter-role" type="text" placeholder="精确匹配"></label>
          <label>WorkMode
            <select id="debug-filter-mode">
              <option value="all">all</option>
              <option value="run">run</option>
              <option value="intake">intake</option>
              <option value="optimize">optimize</option>
            </select>
          </label>
          <label>Lifecycle
            <select id="debug-filter-lifecycle">
              <option value="all">all</option>
              <option value="running">running</option>
              <option value="idle">idle</option>
              <option value="waiting">waiting</option>
              <option value="failed">failed</option>
            </select>
          </label>
          <span id="debug-freshness" class="debug-freshness" aria-live="polite"></span>
        </div>
        <p id="debug-empty" class="debug-empty" hidden>无匹配 Worker。</p>
        <div id="debug-worker-list" class="debug-worker-list"></div>
        <div id="debug-worker-detail" class="debug-worker-detail" hidden></div>
        <div id="debug-degraded" class="debug-degraded" hidden>PTH 检查投影不可用——只读页显式降级。</div>
      </section>
      <section class="page" id="page-memory" data-page-root="memory" hidden>
        <h1>Memory</h1>
        <p class="placeholder">Memory 页面将在后续任务实现。</p>
      </section>
      <section class="page" id="page-config" data-page-root="config" hidden>
        <h1>Config</h1>
        <p class="placeholder">Config 页面将在后续任务实现。</p>
      </section>
    </main>
  </div>

  <script type="module" src="/app.js"></script>
</body>
</html>
